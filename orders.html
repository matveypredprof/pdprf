<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Учёт выдачи | Славное питалово</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f3ff 0%, #ffffff 100%);
      padding: 2rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

.back-btn {
      color: #793aed;     
            text-decoration: none;    
            font-weight: 600;        
            font-size: clamp(14px, 2.8vw, 16px);    
            display: flex;     
            align-items: center;      
            gap: 0.6rem;
            margin-bottom: 30px;
            margin-right: 150px;
            background: none;      
            border: none;
}

    .page-title {
      font-size: 2rem;
      font-weight: 700;
      color: #7c3aed;
      text-shadow: 0 2px 4px rgba(124, 58, 237, 0.1);
      align-items: center;
        justify-content: space-between;
        margin-left: 200px;

    }

    .meal-section {
      background-color: white;
      border-radius: 1.5rem;
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid #ede9fe;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .meal-section h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 1.5rem;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .order-name {
      font-weight: 600;
      font-size: 1.125rem;
      color: #1f2937;
    }

    .order-count input {
      width: 80px;
      padding: 0.5rem;
      border: 1px solid #cbd5e0;
      border-radius: 0.75rem;
      text-align: center;
      font-size: 1rem;
    }

    .save-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(90deg, #7c3aed, #6d28d9);
      color: white;
      border: none;
      border-radius: 1rem;
      font-size: 1.125rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 20px -5px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 class="page-title">Учёт выданных порций</h1>
  </div>


  <a href="index.html" class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left">
        <path d="m12 19-7-7 7-7"></path>
        <path d="M19 12H5"></path>
      </svg>
      Назад
    </a>

  <div class="meal-section">
    <h2>Завтраки</h2>
    <div class="order-item">
      <span class="order-name">Овсянка с ягодами</span>
      <span class="order-count"><input type="number" min="0" value="42" id="oatmeal-berries"></span>
    </div>
    <div class="order-item">
      <span class="order-name">Бутерброд с сыром</span>
      <span class="order-count"><input type="number" min="0" value="38" id="cheese-sandwich"></span>
    </div>
  </div>

  <div class="meal-section">
    <h2>Обеды</h2>
    <div class="order-item">
      <span class="order-name">Суп-пюре из тыквы</span>
      <span class="order-count"><input type="number" min="0" value="55" id="pumpkin-soup"></span>
    </div>
    <div class="order-item">
      <span class="order-name">Куриная котлета с гречкой</span>
      <span class="order-count"><input type="number" min="0" value="50" id="chicken-cutlet-buckwheat"></span>
    </div>
  </div>

  <button class="save-btn" onclick="alert('Данные сохранены!')">Сохранить</button>
</div>

<script>
  lucide.createIcons();
</script>

</body>
</html>
